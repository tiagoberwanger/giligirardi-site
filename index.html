<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>A Semente Estelar | Gili Girardi</title>
    <meta name="description" content="A Semente Estelar: Gili Girardi, terapeuta holística. Astrologia, tarot e radiestesia.">
    <meta name="theme-color" content="#F7F2EA">
    <link rel="icon" href="favicon.png" sizes="32x32">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <!-- Só os 12 glifos do zodíaco (♈–♓), para não carregar a fonte inteira -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols&text=%E2%99%88%E2%99%89%E2%99%8A%E2%99%8B%E2%99%8C%E2%99%8D%E2%99%8E%E2%99%8F%E2%99%90%E2%99%91%E2%99%92%E2%99%93&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="abertura">
        <div class="mapa">
            <svg class="nebulosa" viewBox="0 0 1000 1000" aria-hidden="true">
                <defs>
                    <filter id="aquarela" x="-20%" y="-20%" width="140%" height="140%">
                        <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="4" result="ruido" />
                        <feDisplacementMap in="SourceGraphic" in2="ruido" scale="140" xChannelSelector="R" yChannelSelector="G" result="borrado" />
                        <feGaussianBlur in="borrado" stdDeviation="14" />
                    </filter>
                    <filter id="halo-lua" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="9" />
                    </filter>
                    <radialGradient id="halo">
                        <stop offset="0%" stop-color="#8f84c4" />
                        <stop offset="55%" stop-color="#b5a9db" stop-opacity="0.75" />
                        <stop offset="80%" stop-color="#ecd3c9" stop-opacity="0.5" />
                        <stop offset="100%" stop-color="#F7F2EA" stop-opacity="0" />
                    </radialGradient>
                    <radialGradient id="nucleo">
                        <stop offset="0%" stop-color="#24203f" />
                        <stop offset="50%" stop-color="#2b2750" />
                        <stop offset="75%" stop-color="#4b4380" stop-opacity="0.85" />
                        <stop offset="100%" stop-color="#6f64a8" stop-opacity="0" />
                    </radialGradient>
                    <radialGradient id="nuvem">
                        <stop offset="0%" stop-color="#a597cf" stop-opacity="0.6" />
                        <stop offset="100%" stop-color="#a597cf" stop-opacity="0" />
                    </radialGradient>
                    <radialGradient id="nuvem-pessego">
                        <stop offset="0%" stop-color="#ecd3c9" stop-opacity="0.7" />
                        <stop offset="100%" stop-color="#ecd3c9" stop-opacity="0" />
                    </radialGradient>
                    <!-- Lua crescente: disco claro menos o mesmo disco deslocado -->
                    <mask id="crescente">
                        <circle cx="500" cy="500" r="300" fill="#fff" />
                        <circle cx="508" cy="492" r="300" fill="#000" />
                    </mask>
                </defs>
                <g filter="url(#aquarela)">
                    <circle cx="460" cy="520" r="440" fill="url(#halo)" />
                    <ellipse cx="290" cy="310" rx="190" ry="130" fill="url(#nuvem)" />
                    <ellipse cx="620" cy="810" rx="220" ry="140" fill="url(#nuvem-pessego)" />
                    <circle cx="490" cy="510" r="330" fill="url(#nucleo)" />
                </g>
                <g mask="url(#crescente)">
                    <rect width="1000" height="1000" fill="#d9cff0" filter="url(#halo-lua)" />
                </g>
                <circle cx="500" cy="500" r="300" fill="none" stroke="#f4effa" stroke-width="2" stroke-opacity="0.85" mask="url(#crescente)" />
            </svg>
            <svg class="roda" viewBox="0 0 600 600" aria-hidden="true"></svg>
            <canvas id="ceu" aria-hidden="true"></canvas>
            <h1 class="brilho">
                <span class="so-leitor">Gili Girardi</span>
                <span aria-hidden="true">G<span class="pingo">ı</span>l<span class="pingo">ı</span><br>G<span class="pingo">ı</span>rard<span class="pingo">ı</span></span>
            </h1>
        </div>
    </header>
</body>
</html>
